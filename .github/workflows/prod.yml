  #   runs-on: ubuntu-latest
  #   environment: release
  #   needs: [build]

  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - name: Create Sentry release
  #       uses: getsentry/action-release@v3
  #       env:
  #         SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  #         SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  #         SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  #       with:
  #         environment: production
  #         release: "${{ github.sha}}"

  migrate:
    name: Migrate prod
    runs-on: [self-hosted, helmfile]
    needs: [build]
    environment: stable

    steps:
      - uses: actions/checkout@v4

      - name: Migrate prod
        uses: ./.github/actions/deploy
        with:
          service: migration
          environment: prod

  api:
    name: Deploy api prod
    runs-on: [self-hosted, helmfile]
    needs: [migrate]
    environment: stable
    steps:
      - uses: actions/checkout@v4

      - name: Deploy api prod
        uses: ./.github/actions/deploy
        with:
          service: api
          environment: prod

  worker:
    name: Deploy worker prod
    runs-on: [self-hosted, helmfile]
    needs: [migrate]
    environment: stable
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker prod
        uses: ./.github/actions/deploy
        with:
          service: worker
          environment: prod
