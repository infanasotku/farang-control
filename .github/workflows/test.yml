name: test
on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  build:
    name: Build test
    runs-on: ubuntu-latest
    environment: build

    steps:
      - uses: actions/checkout@v4

      - name: Build test
        uses: ./.github/actions/build
        with:
          environment: test
          registry_url: ${{ vars.REGISTRY_URL }}
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  migrate:
    name: Migrate test
    runs-on: [self-hosted, helmfile]
    needs: [build]
    environment: test

    steps:
      - uses: actions/checkout@v4

      - name: Migrate test
        uses: ./.github/actions/deploy
        with:
          service: migration
          environment: test

  deploy:
    name: Deploy ${{ matrix.service }} test
    runs-on: [self-hosted, helmfile]
    needs: [migrate]
    environment: test
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ${{ matrix.service }} test
        uses: ./.github/actions/deploy
        with:
          service: ${{ matrix.service }}
          environment: test
