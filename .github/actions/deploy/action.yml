name: Deploy
description: Deploy one Helmfile release
inputs:
  service:
    description: Helmfile service label
    required: true
  environment:
    description: Deployment environment
    required: true

runs:
  using: composite
  steps:
    - name: Deploy
      shell: bash
      env:
        TAG: ${{ format('{0}-{1}', inputs.environment, github.run_number) }}

      run: |
        cd k8s
        helmfile -f helmfile.yaml.gotmpl \
          --state-values-set tag="$TAG" \
          -e "${{ inputs.environment }}" \
          -l "svc=${{ inputs.service }}" \
          --skip-refresh apply

    - name: Remove obsolete projection worker after API upgrade
      if: inputs.service == 'api'
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.environment }}
      run: |
        case "$DEPLOY_ENV" in
          prod) namespace=farang-control ;;
          test) namespace=farang-control-test ;;
          *) echo "Unknown deployment environment: $DEPLOY_ENV" >&2; exit 1 ;;
        esac
        helm --kube-context kubernetes-admin@kubernetes \
          uninstall worker --namespace "$namespace" --ignore-not-found --wait --timeout 300s
